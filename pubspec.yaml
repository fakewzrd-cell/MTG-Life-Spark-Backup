name: mgt_life_spark
description: Life Spark — your MTG companion for multiplayer tables.
publish_to: none
version: 1.0.27+33

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR code display
  qr_flutter: ^4.1.0

  # QR code camera scanner
  mobile_scanner: ^7.2.0

  # WebSocket client
  web_socket_channel: ^3.0.1

  # Permissions
  permission_handler: ^12.0.1

  # Commander card images (Scryfall)
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  http: ^1.2.2
  flutter_svg: ^2.0.16

  # Animations
  lottie: ^3.1.3

  # Haptics
  haptic_feedback: ^0.6.4+3

  # Shake detection (mobile)
  sensors_plus: ^6.1.1

  # Screen wake lock
  wakelock_plus: ^1.2.9

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.1.0
  intl: ^0.20.2
  web: ^1.1.1
  meta: ^1.17.0

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  video_player: ^2.11.1
  file_selector: ^1.0.3
  file_saver: ^0.4.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation for Hive adapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  # App icon generation (run: flutter pub run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.1
  # Native launch splash (run: dart run flutter_native_splash:create)
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/placeholders/
    - assets/mana/
    - assets/mana/hybrid/
    - assets/mana/phy/
    - assets/mana/symbol/mana/

# ── App icon config (flutter_launcher_icons) ──────────────────────────────
# Place a 1024x1024 PNG at assets/images/app_icon.png, then run:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#12121A"
    theme_color: "#9B6DFF"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#12121A"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  # Keep mark inside OEM adaptive safe zone (~66% center).
  adaptive_icon_foreground_inset: 28

# Branded launch screen (Android/iOS) — solid black so the logo video can
# start in motion without a static mark sitting on screen first.
# Android 12+ icon is a black vector (`drawable/splash_empty`) so the OS
# never falls back to the launcher mark. After regenerate, restore that
# override in values-v31 / values-night-v31 styles.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
    icon_background_color: "#000000"
    image: assets/images/splash_blank.png
  ios: true
  web: false
