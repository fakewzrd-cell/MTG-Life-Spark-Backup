<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Life Spark — your MTG companion for multiplayer tables.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Life Spark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Life Spark</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000000;
      color: #ffffff;
    }
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 28px;
      background: #000000;
      z-index: 9999;
      position: fixed;
      inset: 0;
    }
    #app-loading .splash-video {
      width: min(340px, 72vw);
      height: min(340px, 72vw);
      object-fit: contain;
      background: #000000;
    }
    #app-loading p {
      margin: 0;
      font-size: 13px;
      opacity: 0.75;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app-loading-text {
      visibility: hidden;
    }
    #app-loading.slow #app-loading-text {
      visibility: visible;
    }
    #app-loading .hint {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <div id="app-loading" aria-live="polite">
    <video
      class="splash-video"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="animations/logo_splash.mp4" type="video/mp4"/>
    </video>
    <p id="app-loading-text">Loading Life Spark…</p>
    <p id="app-loading-hint" class="hint" hidden></p>
  </div>
  <script src="flutter_bootstrap.js" async onerror="window.__flutterLoadFailed && window.__flutterLoadFailed()"></script>
  <script>
    (function () {
      var hint = document.getElementById('app-loading-hint');
      var text = document.getElementById('app-loading-text');
      var videoDone = false;
      var appEntered = false;
      var dismissed = false;

      function dismissLoading() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.setAttribute('data-splash-done', '1');
        if (el.parentNode) el.parentNode.removeChild(el);
      }

      // Keep the HTML layer up through the full clip (frozen on its last frame
      // if the app is still booting). Remove only once Flutter has painted the
      // real app — that avoids a black page between animation and UI.
      function maybeDismiss() {
        if (videoDone && appEntered) dismissLoading();
      }

      function freezeLastFrame(video) {
        try {
          video.pause();
          if (video.duration && isFinite(video.duration) && video.duration > 0) {
            video.currentTime = Math.max(0, video.duration - 0.05);
          }
        } catch (e) {}
      }

      function showLoadingCue() {
        if (dismissed || appEntered) return;
        var el = document.getElementById('app-loading');
        if (el) el.classList.add('slow');
        if (text) text.style.visibility = 'visible';
      }

      function markVideoDone() {
        if (videoDone) return;
        videoDone = true;
        var el = document.getElementById('app-loading');
        if (el) el.setAttribute('data-video-ended', '1');
        window.dispatchEvent(new Event('lifespark-splash-done'));
        maybeDismiss();
        setTimeout(showLoadingCue, 350);
      }

      var TARGET_INTRO_SECONDS = 2.5; // matches BrandedSplash.logoAnimationDuration
      var video = document.querySelector('#app-loading .splash-video');
      if (video) {
        function applyPlaybackRate() {
          var sourceSeconds = video.duration;
          if (sourceSeconds && isFinite(sourceSeconds) && sourceSeconds > 0) {
            video.playbackRate = sourceSeconds / TARGET_INTRO_SECONDS;
          } else {
            video.playbackRate = 3 / TARGET_INTRO_SECONDS;
          }
        }
        video.addEventListener('loadedmetadata', applyPlaybackRate);
        applyPlaybackRate();
        var playPromise = video.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () { markVideoDone(); });
        }
        video.addEventListener('ended', function () {
          freezeLastFrame(video);
          markVideoDone();
        });
        video.addEventListener('error', markVideoDone);
        // Safety only — well after the sped-up clip, in case `ended` never fires.
        setTimeout(function () {
          if (!videoDone) {
            freezeLastFrame(video);
            markVideoDone();
          }
        }, 8000);
      } else {
        markVideoDone();
      }

      window.__flutterLoadFailed = function () {
        if (text) text.textContent = 'Could not load the app.';
        if (hint) {
          hint.hidden = false;
          hint.textContent =
            'Use the Mac dev server in release mode (flutter run -d web-server --release).';
        }
        showLoadingCue();
        markVideoDone();
      };
      window.addEventListener('lifespark-enter-app', function () {
        appEntered = true;
        maybeDismiss();
      });
      window.addEventListener('flutter-first-frame', function () {
        // First frame alone must NOT dismiss — wait for the full logo clip.
      });
      setTimeout(function () {
        if (!document.getElementById('app-loading')) return;
        if (hint) {
          hint.hidden = false;
          hint.textContent =
            'Still loading? Hard-refresh (Cmd+Shift+R). If stuck, clear site data for this URL. Use release server, not debug.';
        }
      }, 15000);
      setTimeout(function () {
        var el = document.getElementById('app-loading');
        if (!el) return;
        if (text) {
          text.textContent = 'Load failed or very slow.';
        }
        if (hint) {
          hint.hidden = false;
          hint.textContent =
            'Clear browser site data for this address, then reload. Debug web builds often hang here.';
        }
        showLoadingCue();
      }, 35000);
    })();
  </script>
</body>
</html>
